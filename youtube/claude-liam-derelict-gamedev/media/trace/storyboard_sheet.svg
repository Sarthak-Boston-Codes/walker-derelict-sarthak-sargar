<svg width="1500" height="760" viewBox="0 0 1500 760" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>DERELICT storyboard sketch sheet, 7 panels</title>
<desc>Simple line-art storyboard: title card, character intro, encounter, success, failure, recovery, end of session.</desc>
<rect x="0" y="0" width="1500" height="760" fill="#17171a"/>
<defs>
  <g id="player-neutral">
    <circle cx="170" cy="130" r="14" fill="none" stroke="#f2c14e" stroke-width="3"/>
    <line x1="170" y1="144" x2="170" y2="195" stroke="#f2c14e" stroke-width="3"/>
    <line x1="170" y1="150" x2="150" y2="190" stroke="#f2c14e" stroke-width="3"/>
    <line x1="170" y1="150" x2="190" y2="190" stroke="#f2c14e" stroke-width="3"/>
    <line x1="170" y1="195" x2="155" y2="240" stroke="#f2c14e" stroke-width="3"/>
    <line x1="170" y1="195" x2="185" y2="240" stroke="#f2c14e" stroke-width="3"/>
    <rect x="181" y="140" width="9" height="16" fill="#f2c14e"/>
  </g>
  <g id="zombie-stand">
    <circle cx="0" cy="130" r="12" fill="#2c3a22" stroke="#6b8f4e" stroke-width="3"/>
    <line x1="0" y1="142" x2="6" y2="190" stroke="#6b8f4e" stroke-width="3"/>
    <polyline points="3,155 -20,145 -32,170" fill="none" stroke="#6b8f4e" stroke-width="3"/>
    <line x1="4" y1="160" x2="24" y2="150" stroke="#6b8f4e" stroke-width="3"/>
    <line x1="6" y1="190" x2="-8" y2="238" stroke="#6b8f4e" stroke-width="3"/>
    <line x1="6" y1="190" x2="20" y2="238" stroke="#6b8f4e" stroke-width="3"/>
  </g>
</defs>

<!-- Panel 1: Title / intro -->
<g transform="translate(20,20)">
  <rect width="340" height="300" fill="#121214" stroke="#3a3a3a"/>
  <polygon points="40,230 90,120 140,230" fill="none" stroke="#54504a" stroke-width="2"/>
  <polygon points="150,230 210,90 270,230" fill="none" stroke="#54504a" stroke-width="2"/>
  <rect x="100" y="180" width="18" height="30" fill="none" stroke="#54504a"/>
  <rect x="190" y="160" width="18" height="30" fill="none" stroke="#54504a"/>
  <text x="170" y="120" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#8b4a2b">DERELICT</text>
  <text x="170" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c9a27e">1. Title / intro - first thing seen</text>
</g>

<!-- Panel 2: Character intro, close-up -->
<g transform="translate(380,20)">
  <rect width="340" height="300" fill="#232320" stroke="#3a3a3a"/>
  <g transform="translate(20,40) scale(1.5)"><use href="#player-neutral"/></g>
  <text x="170" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c9a27e">2. Character intro - close-up, eye level</text>
</g>

<!-- Panel 3: Core action / encounter -->
<g transform="translate(740,20)">
  <rect width="340" height="300" fill="#232320" stroke="#3a3a3a"/>
  <line x1="0" y1="240" x2="340" y2="240" stroke="#4a443c" stroke-width="2"/>
  <polygon points="170,150 320,90 320,220" fill="#f2c14e" opacity="0.08"/>
  <use href="#player-neutral"/>
  <line x1="170" y1="150" x2="230" y2="145" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="155" x2="230" y2="150" stroke="#f2c14e" stroke-width="3"/>
  <g transform="translate(260,0)"><use href="#zombie-stand"/></g>
  <text x="170" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c9a27e">3. Encounter - medium, bird's-eye (gameplay)</text>
</g>

<!-- Panel 4: Success -->
<g transform="translate(1100,20)">
  <rect width="340" height="300" fill="#232320" stroke="#3a3a3a"/>
  <line x1="0" y1="240" x2="340" y2="240" stroke="#4a443c" stroke-width="2"/>
  <g transform="translate(-20,0) scale(1.3)"><use href="#player-neutral"/></g>
  <line x1="150" y1="150" x2="230" y2="140" stroke="#f2c14e" stroke-width="3"/>
  <polyline points="230,140 245,130 250,142 258,132" fill="none" stroke="#f2c14e" stroke-width="2"/>
  <circle cx="280" cy="225" r="11" fill="#2c3a22" stroke="#6b8f4e" stroke-width="3"/>
  <line x1="245" y1="233" x2="300" y2="233" stroke="#6b8f4e" stroke-width="3"/>
  <text x="170" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c9a27e">4. Success - close-up, bird's-eye (gameplay)</text>
</g>

<!-- Panel 5: Failure -->
<g transform="translate(20,380)">
  <rect width="340" height="300" fill="#232320" stroke="#3a3a3a"/>
  <line x1="0" y1="240" x2="340" y2="240" stroke="#4a443c" stroke-width="2"/>
  <use href="#player-neutral"/>
  <g transform="translate(90,0) scale(-1,1)"><use href="#zombie-stand"/></g>
  <text x="90" y="100" font-family="sans-serif" font-size="20" fill="#e24b4a">!</text>
  <text x="170" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c9a27e">5. Failure - medium, bird's-eye (gameplay)</text>
</g>

<!-- Panel 6: Recovery -->
<g transform="translate(380,380)">
  <rect width="340" height="300" fill="#232320" stroke="#3a3a3a"/>
  <line x1="0" y1="240" x2="340" y2="240" stroke="#4a443c" stroke-width="2"/>
  <circle cx="170" cy="155" r="14" fill="none" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="169" x2="170" y2="205" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="175" x2="140" y2="225" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="175" x2="195" y2="195" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="205" x2="150" y2="230" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="205" x2="190" y2="230" stroke="#f2c14e" stroke-width="3"/>
  <text x="170" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c9a27e">6. Recovery - medium, bird's-eye (gameplay)</text>
</g>

<!-- Panel 7: End of session -->
<g transform="translate(740,380)">
  <rect width="340" height="300" fill="#2b3024" stroke="#3a3a3a"/>
  <rect x="270" y="90" width="50" height="150" fill="#f2c14e" opacity="0.15" stroke="#f2c14e"/>
  <text x="295" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f2c14e">EXIT</text>
  <circle cx="170" cy="130" r="14" fill="none" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="144" x2="170" y2="195" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="150" x2="140" y2="100" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="150" x2="200" y2="100" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="195" x2="155" y2="240" stroke="#f2c14e" stroke-width="3"/>
  <line x1="170" y1="195" x2="185" y2="240" stroke="#f2c14e" stroke-width="3"/>
  <text x="170" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c9a27e">7. End of session - wide, bird's-eye (gameplay)</text>
</g>

</svg>
