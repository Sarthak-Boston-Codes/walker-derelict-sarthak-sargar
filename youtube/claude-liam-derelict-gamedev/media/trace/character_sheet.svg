<!-- Collision overlay note -->
<text x="20" y="690" font-family="sans-serif" font-size="13" fill="#8b4a2b">Collision overlay: a single ~20px-radius circle centered on the torso of pose 1 (Reference) — identical on every pose above; flashlight/weapon/arms extend beyond it.</text>

