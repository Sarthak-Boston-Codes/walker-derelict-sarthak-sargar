<svg width="1540" height="700" viewBox="0 0 1540 700" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>DERELICT scavenger character pose sheet, 10 poses</title>
<desc>Simple consistent stick-figure poses: reference, silhouette, idle, walk, aim, shoot follow-through, hurt, grabbed-fail, recover, celebrate.</desc>
<rect x="0" y="0" width="1540" height="700" fill="#17171a"/>

<!-- helper: floor line + cell background drawn per-cell -->

<!-- 1. Reference -->
<g transform="translate(20,20)">
  <rect width="280" height="280" fill="#232320" stroke="#3a3a3a"/>
  <line x1="40" y1="60" x2="40" y2="220" stroke="#54504a" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="140" cy="110" r="14" fill="none" stroke="#f2c14e" stroke-width="3"/>
  <line x1="140" y1="124" x2="140" y2="175" stroke="#f2c14e" stroke-width="3"/>
  <line x1="140" y1="130" x2="120" y2="170" stroke="#f2c14e" stroke-width="3"/>
  <line x1="140" y1="130" x2="160" y2="170" stroke="#f2c14e" stroke-width="3"/>
  <line x1="140" y1="175" x2="125" y2="220" stroke="#f2c14e" stroke-width="3"/>
  <line x1="140" y1="175" x2="155" y2="220" stroke="#f2c14e" stroke-width="3"/>
  <rect x="151" y="120" width="9" height="16" fill="#f2c14e"/>
  <text x="140" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c9a27e">1. Reference</text>
</g>

<!-- 2. Silhouette -->
